<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>The Drug Court App</title>
    <meta name="description" content="Meeting tracking, sobriety counter, phase progress, and community support for drug court participants." />

    <!-- Theme color (Android address bar / task switcher) -->
    <meta name="theme-color" content="#132540" />

    <!-- Android / Chrome: installability -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS: makes "Add to Home Screen" open full-screen, no Safari chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Drug Court App" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
